<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Explore CDS par spread, protection leg, risky annuity, upfront value, and hazard bootstrap assumptions locally." />
    <title>Credit — Argentum</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <a class="wordmark" href="/"><span class="bar"></span>Argentum</a>
      <nav></nav>
    </header>
    <main class="wrap desk">
      <form class="panel" id="form">
        <p class="eyebrow">ISDA-style CDS</p>
        <label>Evaluation date <input name="as_of" type="date" value="2026-08-24" /></label>
        <label>Hazard <input name="hazard" type="number" step="0.001" value="0.012" /></label>
        <label>Recovery <input name="recovery" type="number" step="0.05" value="0.4" /></label>
        <label>Running coupon <input name="coupon" type="number" step="0.001" value="0.01" /></label>
        <label>Discount zero <input name="curve" type="number" step="0.001" value="0.02" /></label>
        <label>Tenor years <input name="years" type="number" step="1" value="5" /></label>
        <button class="btn" type="submit">Mark CDS</button>
        <p class="err" id="err"></p>
      </form>
      <div>
        <div class="metrics" id="metrics"></div>
        <p class="note" id="blurb"></p>
        <table class="data" id="table"></table>
      </div>
    </main>
    <footer>Protection, risky PV01, par, bootstrapped hazards</footer>
    <script src="/chrome.js"></script>
    <script src="/credit.js"></script>
  </body>
</html>

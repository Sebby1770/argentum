<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Explore fixed-rate bond clean price, dirty price, accrued interest, duration, and convexity in local Argentum Studio." />
    <title>Bond — Argentum</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <a class="wordmark" href="/"><span class="bar"></span>Argentum</a>
      <nav>
        <a href="/">Front</a>
        <a href="/lab">Lab</a>
        <a href="/smile">Smile</a>
        <a href="/rates">Rates</a>
        <a href="/bond" aria-current="page">Bond</a>
        <a href="/docs">Docs</a>
      </nav>
    </header>
    <main class="wrap desk">
      <form class="panel" id="form">
        <p class="eyebrow">Fixed coupon</p>
        <label>Evaluation date <input name="as_of" type="date" value="2026-08-15" /></label>
        <label>Coupon <input name="coupon" type="number" step="0.001" value="0.05" /></label>
        <label>YTM <input name="ytm" type="number" step="0.001" value="0.045" /></label>
        <label>Years <input name="years" type="number" step="1" value="10" /></label>
        <label>Frequency
          <select name="freq">
            <option value="1">Annual</option>
            <option value="2" selected>Semiannual</option>
            <option value="4">Quarterly</option>
          </select>
        </label>
        <label>Face <input name="face" type="number" step="1" value="100" /></label>
        <button class="btn" type="submit">Solve</button>
        <p class="err" id="err"></p>
      </form>
      <div><div class="metrics" id="metrics"></div><p class="note" id="blurb"></p></div>
    </main>
    <footer>Argentum Bond · dirty, clean, Mac, mod, convexity</footer>
    <script src="/chrome.js"></script>
    <script src="/bond.js"></script>
  </body>
</html>

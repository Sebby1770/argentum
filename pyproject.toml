[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argentum"
version = "1.5.0"
description = "Typed derivatives pricing and portfolio-risk reporting for Python teams."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Sebastian Forbes" }]
keywords = [
    "quant",
    "derivatives",
    "options",
    "fixed-income",
    "black-scholes",
    "sabr",
    "heston",
    "yield-curve",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
argentum = "argentum.cli:main"

[project.urls]
Homepage = "https://github.com/Sebby1770/argentum"
Documentation = "https://github.com/Sebby1770/argentum#readme"
Issues = "https://github.com/Sebby1770/argentum/issues"
Source = "https://github.com/Sebby1770/argentum"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
argentum = [
    "py.typed",
    "static/*.css",
    "static/*.html",
    "static/*.js",
    "static/*.json",
    "static/*.svg",
    "static/*.txt",
    "static/*.xml",
    "static/*.csv",
    "static/media/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

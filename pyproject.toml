[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argentum"
version = "1.4.0"
description = "Production-grade derivatives pricing library: curves, bonds, swaps, vol, exotics, risk."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Sebastian Forbes" }]
keywords = [
    "quant",
    "derivatives",
    "options",
    "fixed-income",
    "black-scholes",
    "sabr",
    "heston",
    "yield-curve",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
argentum = "argentum.cli:main"

[project.urls]
Homepage = "https://github.com/Sebby1770/argentum"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
argentum = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Heston — Argentum</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,360&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <a class="wordmark" href="/"><span class="bar"></span>Argentum</a>
      <nav></nav>
    </header>
    <main class="wrap desk">
      <form class="panel" id="form">
        <p class="eyebrow">COS Heston</p>
        <label>Spot <input name="spot" type="number" value="100" /></label>
        <label>Strike <input name="strike" type="number" value="100" /></label>
        <label>Rate <input name="rate" type="number" step="0.001" value="0.03" /></label>
        <label>Expiry <input name="texp" type="number" step="0.05" value="1" /></label>
        <label>Kappa <input name="kappa" type="number" step="0.1" value="1.5" /></label>
        <label>Theta <input name="theta" type="number" step="0.005" value="0.04" /></label>
        <label>Vol-of-vol <input name="sigma" type="number" step="0.05" value="0.4" /></label>
        <label>Rho <input name="rho" type="number" step="0.05" value="-0.5" /></label>
        <label>v0 <input name="v0" type="number" step="0.005" value="0.04" /></label>
        <button class="btn" type="submit">Price</button>
        <p class="err" id="err"></p>
      </form>
      <div>
        <div class="metrics" id="metrics"></div>
        <p class="note" id="blurb"></p>
      </div>
    </main>
    <footer>Fang–Oosterlee COS · little Heston trap</footer>
    <script src="/chrome.js"></script>
    <script src="/heston.js"></script>
  </body>
</html>

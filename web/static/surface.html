<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Surface — Argentum</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,360&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <a class="wordmark" href="/"><span class="bar"></span>Argentum</a>
      <nav></nav>
    </header>
    <main class="wrap desk">
      <form class="panel" id="form">
        <p class="eyebrow">SABR surface</p>
        <label>Forward <input name="forward" type="number" step="0.001" value="0.03" /></label>
        <label>Alpha <input name="alpha" type="number" step="0.001" value="0.04" /></label>
        <label>Beta <input name="beta" type="number" step="0.05" value="0.5" /></label>
        <label>Rho <input name="rho" type="number" step="0.05" value="-0.3" /></label>
        <label>Nu <input name="nu" type="number" step="0.05" value="0.5" /></label>
        <button class="btn" type="submit">Build</button>
        <p class="err" id="err"></p>
      </form>
      <div>
        <p class="note">Rows are expiries, columns are moneyness. Colour is implied vol.</p>
        <div class="heat" id="heat"></div>
      </div>
    </main>
    <footer>Hagan SABR on a strike × tenor grid</footer>
    <script src="/chrome.js"></script>
    <script src="/surface.js"></script>
  </body>
</html>

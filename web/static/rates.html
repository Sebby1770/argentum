<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rates — Argentum</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,360&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <a class="wordmark" href="/"><span class="bar"></span>Argentum</a>
      <nav>
        <a href="/">Front</a>
        <a href="/lab">Lab</a>
        <a href="/smile">Smile</a>
        <a href="/rates" aria-current="page">Rates</a>
        <a href="/bond">Bond</a>
        <a href="/docs">Docs</a>
      </nav>
    </header>
    <main class="wrap desk">
      <form class="panel" id="form">
        <p class="eyebrow">Vanilla IRS</p>
        <label>Tenor
          <select name="tenor">
            <option>2Y</option>
            <option selected>5Y</option>
            <option>10Y</option>
            <option>30Y</option>
          </select>
        </label>
        <label>Fixed rate <input name="rate" type="number" step="0.0005" value="0.04" /></label>
        <label>Flat zero <input name="curve" type="number" step="0.0005" value="0.04" /></label>
        <label>Notional <input name="notional" type="number" step="1000" value="1000000" /></label>
        <button class="btn" type="submit">Price swap</button>
        <p class="err" id="err"></p>
        <p class="note">Pay-fixed on a flat continuous zero. Residual vs par is day-count, not a bug.</p>
      </form>
      <div>
        <div class="metrics" id="metrics"></div>
        <p class="note" id="blurb"></p>
      </div>
    </main>
    <footer>Argentum Rates · dual-curve ready in the library, flat demo here</footer>
    <script src="/rates.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book — Argentum</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,360&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />

  <body>
    <header class="top">
      <a class="wordmark" href="/"><span class="bar"></span>Argentum</a>
      <nav></nav>
    </header>
    <main class="wrap desk">
      <form class="panel" id="form">
        <p class="eyebrow">Call spread + put</p>
        <p class="note">Default blotter: long ATM call, short 110 call, long 90 put. Scenarios bump spot, vol, and rate through the same book engine.</p>
        <button class="btn" type="submit">Re-mark</button>
        <p class="err" id="err"></p>
      </form>
      <div>
        <div class="metrics" id="metrics"></div>
        <table class="data" id="table"></table>
      </div>
    </main>
    <footer>Scenario PnL · not a live blotter</footer>
    <script src="/chrome.js"></script>
    <script src="/book.js"></script>
  </body>
</html>

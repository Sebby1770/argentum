<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lab — Argentum</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,360&family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <a class="wordmark" href="/"><span class="bar"></span>Argentum</a>
      <nav>
        <a href="/">Front</a>
        <a href="/lab" aria-current="page">Lab</a>
        <a href="/smile">Smile</a>
        <a href="/rates">Rates</a>
        <a href="/bond">Bond</a>
        <a href="/docs">Docs</a>
      </nav>
    </header>
    <main class="wrap desk">
      <form class="panel" id="form">
        <p class="eyebrow">Vanilla desk</p>
        <label>Symbol <input name="symbol" id="lab-symbol" placeholder="AAPL" autocomplete="off" /></label>
        <button class="btn ghost" type="button" id="pull-spot">Pull last print</button>
        <label>Spot <input name="spot" type="number" step="0.1" value="100" /></label>
        <label>Strike <input name="strike" type="number" step="0.1" value="100" /></label>
        <label>Rate <input name="rate" type="number" step="0.001" value="0.05" /></label>
        <label>Dividend <input name="div" type="number" step="0.001" value="0" /></label>
        <label>Vol <input name="vol" type="number" step="0.001" value="0.20" /></label>
        <label>Expiry (years) <input name="texp" type="number" step="0.01" value="1" /></label>
        <label>Type
          <select name="type">
            <option value="call">Call</option>
            <option value="put">Put</option>
          </select>
        </label>
        <label>Style
          <select name="style">
            <option value="european">European</option>
            <option value="american">American tree/FD</option>
          </select>
        </label>
        <button class="btn" type="submit">Mark</button>
        <p class="err" id="err"></p>
        <p class="note">Pull last print uses the feed saved on Front. Analytic Black–Scholes plus tree, FD, and Monte Carlo on the same inputs.</p>
      </form>
      <div>
        <div class="metrics" id="metrics"></div>
        <div class="engines" id="engines"></div>
        <canvas class="chart" id="chart" width="900" height="360" aria-label="Value versus spot"></canvas>
        <p class="note" id="compare"></p>
      </div>
    </main>
    <footer>Argentum Lab · numbers from /api/vanilla</footer>
    <script src="/chrome.js"></script>
    <script src="/charts.js"></script>
    <script src="/lab.js"></script>
  </body>
</html>
